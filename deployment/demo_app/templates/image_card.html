<figure class="clinical-image"><a href="/case-image/{{ im.id }}" target="_blank"><img src="/case-image/{{ im.id }}" alt="{{ im.eye_side + ' eye' if im.eye_side in ['Left','Right'] else 'Eye side unknown' }} uploaded image" loading="lazy"></a><figcaption><strong>{{ im.eye_side + ' eye' if im.eye_side in ['Left','Right'] else 'Eye side unknown' }}</strong><br>{{ im.created_at[:16]|replace('T',' ') }}{% if im.analysis and im.analysis.status=='ok' %}<p>{{ im.analysis.top_class|title }} · {{ '%.1f'|format(im.analysis.confidence*100) }}% model score</p>{% if im.analysis.laterality_unknown %}<p>{{ im.analysis.laterality_note }}</p>{% endif %}<details><summary>Four-agent workflow</summary>{% for stage in im.analysis.agent_workflow %}<p><strong>{{ stage.agent }}</strong><br>{{ stage.summary }}</p>{% endfor %}</details>{% endif %}</figcaption></figure>
